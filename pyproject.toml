[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ansiscan"
version = "0.1.0"
description = "Tokenize and strip ANSI/VT100 terminal escape sequences from text"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "lisat8" }]

[tool.setuptools.packages.find]
where = ["src"]
